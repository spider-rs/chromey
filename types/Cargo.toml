[package]
name = "chromey_types"
version = "3.0.0"
authors = ["Matthias Seitz <matthias.seitz@outlook.de>", "j-mendez <jeff@spider.cloud>"]
edition = "2021"
description = "Core command, event and message types for chromey, the Chrome DevTools Protocol library"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/spider-rs/chromey"
repository = "https://github.com/spider-rs/chromey"
readme = "../README.md"
include = ["src/**/*", "LICENSE-*"]

[lib]
name = "chromey_types"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
