name: Rust
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/cache@v3
        id: cache
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Build
        run: cargo build --verbose --release
      - name: Build examples
        run: cargo build --examples
      - name: Build with parallel-handler
        run: cargo build --features parallel-handler
      - name: Run tests
        run: xvfb-run cargo test
      - name: Run tests with parallel-handler
        run: xvfb-run cargo test --features parallel-handler

