[package]
name = "chromey_pdl"
version = "3.0.0"
authors = ["Matthias Seitz <matthias.seitz@outlook.de>", "j-mendez <jeff@spider.cloud>"]
edition = "2021"
rust-version = "1.70"
license = "MIT OR Apache-2.0"
description = "PDL parser and Rust code generator for chromey, the Chrome DevTools Protocol library"
homepage = "https://github.com/spider-rs/chromey"
repository = "https://github.com/spider-rs/chromey"
readme = "../README.md"
include = ["src/**/*", "LICENSE-*"]

[lib]
name = "chromey_pdl"

[dependencies]
once_cell = "1"
regex = "1"
quote = "1"
proc-macro2 = "1"
heck = "0.5"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
chromey_types = { path = "../types", version = "3" }
either = "1.15"

[features]
serde0 = []
