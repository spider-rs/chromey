[package]
name = "chromey_cdp"
version = "3.0.0"
authors = ["Matthias Seitz <matthias.seitz@outlook.de>", "j-mendez <jeff@spider.cloud>"]
edition = "2021"
rust-version = "1.70"
description = "Generated Chrome DevTools Protocol types for chromey"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/spider-rs/chromey"
repository = "https://github.com/spider-rs/chromey"
readme = "../README.md"
include = ["src/**/*", "*.pdl", "LICENSE-*"]

[lib]
name = "chromey_cdp"

[features]
serde0 = ["chromey_pdl/serde0"]

[dev-dependencies]
chromey_pdl = { path = "../pdl", version = "3" }
ureq = "2"
tempfile = "3"

[dependencies]
chromey_pdl = { path = "../pdl", version = "3" }
chromey_types = { path = "../types", version = "3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
